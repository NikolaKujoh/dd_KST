{% extends "base.html" %}
{% block body %}
<h2>{{ "Registracija" if mode == "register" else "Prijava" }}</h2>
<form method="post">
  <input type="text" name="username" placeholder="Nadimak" required autocomplete="username">
  <input type="password" name="password" placeholder="Lozinka" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
  <button>{{ "Napravi nalog" if mode == "register" else "Uloguj se" }}</button>
</form>
{% if mode == "register" %}
  <p>Već imaš nalog? <a href="{{ url_for('login') }}">Prijava</a></p>
{% else %}
  <p>Nemaš nalog? <a href="{{ url_for('register') }}">Registracija</a></p>
{% endif %}
{% endblock %}
